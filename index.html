<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI STORE MANAGER PRO 2.5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f9;font-family:Arial,sans-serif;color:#202938}
header{background:#172554;color:white;padding:18px}
header h2{margin:0}
nav{display:flex;overflow:auto;background:white;position:sticky;top:0}
nav button{border:0;background:white;padding:14px;white-space:nowrap}
nav button.active{color:#2563eb;border-bottom:3px solid #2563eb}
main{max-width:1000px;margin:auto;padding:15px}
.card{background:white;padding:16px;border-radius:12px;margin-bottom:14px;box-shadow:0 2px 8px #0000000c}
input,select,textarea{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccd2dd;border-radius:7px}
button.action{background:#2563eb;color:white;border:0;padding:11px 16px;border-radius:7px;margin:4px;cursor:pointer}
button.danger{background:#dc2626}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}
.page{display:none}.page.show{display:block}
.stat{display:inline-block;width:48%;padding:12px;background:#eff6ff;border-radius:9px;margin:1%}
.small{color:#64748b;font-size:12px}
</style>
</head>
<body>

<header>
<h2>AI STORE MANAGER PRO 2.5</h2>
<p>智能店铺管理系统</p>
</header>

<nav id="nav">
<button class="active" onclick="show('dashboard',this)">首页</button>
<button onclick="show('products',this)">产品库存</button>
<button onclick="show('transactions',this)">进销记录</button>
<button onclick="show('expenses',this)">费用</button>
<button onclick="show('reports',this)">报表导出</button>
<button onclick="show('ai',this)">AI分析</button>
<button onclick="show('backup',this)">数据备份</button>
</nav>

<main>
<section id="login" class="card">
<h3>登录 / 注册</h3>
<input id="email" type="email" placeholder="邮箱">
<input id="password" type="password" placeholder="密码">
<button class="action" onclick="auth('login')">登录</button>
<button class="action" onclick="auth('register')">注册</button>
<p id="authMsg"></p>
</section>

<div id="app" style="display:none">

<section id="dashboard" class="page show">
<div class="card">
<h3>经营概览</h3>
<div class="stat">产品数量<br><b id="productCount">0</b></div>
<div class="stat">库存总量<br><b id="stockTotal">0</b></div>
<div class="stat">销售收入<br><b id="salesTotal">0</b></div>
<div class="stat">费用总额<br><b id="expenseTotal">0</b></div>
<div class="stat">估算利润<br><b id="profitTotal">0</b></div>
<button class="action" onclick="loadData()">刷新数据</button>
</div>
<div class="card">
<h3>库存不足提醒</h3>
<div id="lowStock"></div>
</div>
</section>

<section id="products" class="page">
<div class="card">
<h3>添加产品</h3>
<input id="pname" placeholder="产品名称">
<input id="pcost" type="number" placeholder="成本价">
<input id="pprice" type="number" placeholder="销售价">
<input id="pstock" type="number" placeholder="库存数量">
<button class="action" onclick="addProduct()">添加产品</button>
</div>
<div class="card">
<h3>产品列表</h3>
<div id="productList"></div>
</div>
</section>

<section id="transactions" class="page">
<div class="card">
<h3>记录进货 / 销售</h3>
<select id="txProduct"></select>
<select id="txType">
<option value="purchase">进货</option>
<option value="sale">销售</option>
</select>
<input id="txQty" type="number" placeholder="数量">
<input id="txPrice" type="number" placeholder="单价">
<button class="action" onclick="addTransaction()">保存记录</button>
</div>
<div class="card"><h3>交易记录</h3><div id="txList"></div></div>
</section>

<section id="expenses" class="page">
<div class="card">
<h3>新增费用</h3>
<select id="expenseCategory">
<option>租金</option><option>工资</option><option>水电</option>
<option>运输</option><option>营销</option><option>维修</option><option>其他</option>
</select>
<input id="expenseDesc" placeholder="费用说明">
<input id="expenseAmount" type="number" placeholder="金额">
<button class="action" onclick="addExpense()">保存费用</button>
</div>
<div class="card"><h3>费用记录</h3><div id="expenseList"></div></div>
</section>

<section id="reports" class="page">
<div class="card">
<h3>报表中心</h3>
<button class="action" onclick="exportExcel('products')">导出产品</button>
<button class="action" onclick="exportExcel('transactions')">导出交易</button>
<button class="action" onclick="exportExcel('expenses')">导出费用</button>
<button class="action" onclick="exportExcel('all')">导出全部</button>
</div>
<div class="card">
<h3>每日经营报告</h3>
<input type="date" id="reportDate">
<button class="action" onclick="dailyReport()">生成日报</button>
<button class="action" onclick="window.print()">打印报告</button>
<div id="dailyReport"></div>
</div>
</section>

<section id="ai" class="page">
<div class="card">
<h3>AI 经营分析</h3>
<p class="small">本地规则分析，不代表云端AI预测。</p>
<button class="action" onclick="analyzeBusiness()">开始分析</button>
<div id="aiResult"></div>
</div>
</section>

<section id="backup" class="page">
<div class="card">
<h3>数据备份</h3>
<button class="action" onclick="backupJSON()">下载 JSON 备份</button>
<p class="small">备份包含产品、交易和费用记录及图片URL，不包含图片文件本身。</p>
</div>
</section>

<button class="action danger" onclick="logout()">退出登录</button>
</div>
</main>

<script>
const SUPABASE_URL="https://owpfcmsrizmbyzimwlsk.supabase.co";
const SUPABASE_KEY="sb_publishable_a434FlqYzGtKIsRd_aHfA_nEUb-C1f";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let store=null,user=null;
let products=[],transactions=[],expenses=[];

const money=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});

async function auth(type){
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 if(!email||!password)return alert('请输入邮箱和密码');
 const result=type==='login'
 ?await db.auth.signInWithPassword({email,password})
 :await db.auth.signUp({email,password});
 if(result.error)return authMsg.innerText=result.error.message;
 if(type==='register'&&!result.data.session){
 authMsg.innerText='注册成功，请检查邮箱确认后登录';return;
 }
 user=result.data.user;
 await initStore();
}

async function initStore(){
 const {data,error}=await db.from('stores').select('*').eq('owner_id',user.id).limit(1).maybeSingle();
 if(error)return alert(error.message);
 if(data)store=data;
 else{
 const name=prompt('请输入店铺名称');
 if(!name)return;
 const r=await db.from('stores').insert({owner_id:user.id,store_name:name}).select().single();
 if(r.error)return alert(r.error.message);
 store=r.data;
 }
 login.style.display='none';
 app.style.display='block';
 await loadData();
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

function show(id,btn){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));
 document.getElementById(id).classList.add('show');
 document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('active'));
 btn.classList.add('active');
}

async function loadData(){
 if(!store)return;
 const sid=store.id;
 const [p,t,e]=await Promise.all([
 db.from('products').select('*').eq('store_id',sid).order('created_at',{ascending:false}),
 db.from('inventory_transactions').select('*').eq('store_id',sid).order('created_at',{ascending:false}),
 db.from('expenses').select('*').eq('store_id',sid).order('expense_date',{ascending:false})
 ]);
 if(p.error||t.error||e.error)return alert('读取数据失败：'+(p.error||t.error||e.error).message);
 products=p.data||[];
 transactions=t.data||[];
 expenses=e.data||[];
 render();
}

function render(){
 productCount.innerText=products.length;
 stockTotal.innerText=products.reduce((s,p)=>s+Number(p.stock||0),0);
 const sales=transactions.filter(t=>t.transaction_type==='sale');
 const revenue=sales.reduce((s,t)=>s+Number(t.quantity)*Number(t.unit_price),0);
 const costs=sales.reduce((s,t)=>{
 const p=products.find(x=>x.id===t.product_id);
 return s+Number(t.quantity)*Number(p?.cost_price||0);
 },0);
 const exp=expenses.reduce((s,e)=>s+Number(e.amount||0),0);
 salesTotal.innerText=money(revenue);
 expenseTotal.innerText=money(exp);
 profitTotal.innerText=money(revenue-costs-exp);

 productList.innerHTML='<table><tr><th>产品</th><th>成本</th><th>售价</th><th>库存</th><th>操作</th></tr>'+
 products.map(p=>`<tr><td>${esc(p.name)}</td><td>${money(p.cost_price)}</td><td>${money(p.selling_price)}</td><td>${p.stock}</td><td><button onclick="removeProduct('${p.id}')">删除</button></td></tr>`).join('')+'</table>';

 txProduct.innerHTML=products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
 lowStock.innerHTML=products.filter(p=>Number(p.stock)<=5).map(p=>esc(p.name)+'：库存 '+p.stock).join('<br>')||'库存正常';

 txList.innerHTML=transactions.map(t=>`<p>${t.transaction_type==='sale'?'销售':'进货'} | ${esc(products.find(p=>p.id===t.product_id)?.name||'产品')} | ${t.quantity} × ${money(t.unit_price)}</p>`).join('');
 expenseList.innerHTML=expenses.map(e=>`<p>${esc(e.expense_date||'')} | ${esc(e.category||'')} | ${esc(e.description||'')} | ${money(e.amount)}</p>`).join('');
}

function esc(s){
 return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function addProduct(){
 const name=pname.value.trim(),cost=Number(pcost.value),price=Number(pprice.value),stock=Number(pstock.value);
 if(!name||cost<0||price<0||stock<0)return alert('请正确填写产品资料');
 const r=await db.from('products').insert({store_id:store.id,name,cost_price:cost,selling_price:price,stock});
 if(r.error)return alert(r.error.message);
 pname.value=pcost.value=pprice.value=pstock.value='';
 await loadData();
}

async function addTransaction(){
 const product_id=txProduct.value,type=txType.value;
 const quantity=Number(txQty.value),unit_price=Number(txPrice.value);
 if(!product_id||quantity<=0||unit_price<0)return alert('请检查交易资料');
 const r=await db.rpc('record_inventory_transaction',{
 p_store_id:store.id,p_product_id:product_id,
 p_type:type,p_quantity:quantity,p_unit_price:unit_price
 });
 if(r.error)return alert(r.error.message);
 txQty.value=txPrice.value='';
 await loadData();
}

async function addExpense(){
 const amount=Number(expenseAmount.value);
 if(amount<=0)return alert('费用金额必须大于0');
 const r=await db.from('expenses').insert({
 store_id:store.id,
 expense_date:new Date().toISOString().slice(0,10),
 category:expenseCategory.value,
 description:expenseDesc.value,
 amount
 });
 if(r.error)return alert(r.error.message);
 expenseDesc.value=expenseAmount.value='';
 await loadData();
}

async function removeProduct(id){
 if(!confirm('确定删除产品？'))return;
 const r=await db.from('products').delete().eq('id',id).eq('store_id',store.id);
 if(r.error)return alert(r.error.message);
 await loadData();
}

function exportExcel(type){
 let data={products,transactions,expenses};
 if(type==='all'){
  data={产品:products,交易:transactions,费用:expenses};
 }else data=data[type];
 const wb=XLSX.utils.book_new();
 if(type==='all'){
  Object.entries(data).forEach(([name,rows])=>{
   XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),name);
  });
 }else{
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),type);
 }
 XLSX.writeFile(wb,'Store_'+type+'.xlsx');
}

function dailyReport(){
 const date=document.getElementById('reportDate').value||new Date().toISOString().slice(0,10);
 const tx=transactions.filter(t=>(t.created_at||'').slice(0,10)===date);
 const ex=expenses.filter(e=>e.expense_date===date);
 const sales=tx.filter(t=>t.transaction_type==='sale');
 const buys=tx.filter(t=>t.transaction_type==='purchase');
 const revenue=sales.reduce((s,t)=>s+Number(t.quantity)*Number(t.unit_price),0);
 const purchase=buys.reduce((s,t)=>s+Number(t.quantity)*Number(t.unit_price),0);
 const cost=sales.reduce((s,t)=>{
  const p=products.find(x=>x.id===t.product_id);
  return s+Number(t.quantity)*Number(p?.cost_price||0);
 },0);
 const expense=ex.reduce((s,e)=>s+Number(e.amount),0);
 dailyReport.innerHTML=`
 <h3>${date} 经营日报</h3>
 <p>销售收入：${money(revenue)}</p>
 <p>进货金额：${money(purchase)}</p>
 <p>费用：${money(expense)}</p>
 <p>估算毛利：${money(revenue-cost)}</p>
 <p>估算净利润：${money(revenue-cost-expense)}</p>`;
}

function analyzeBusiness(){
 const result=[];
 const low=products.filter(p=>Number(p.stock)<=5);
 if(low.length)result.push('库存提醒：'+low.map(p=>p.name).join('、')+' 库存不高于5。');
 const noSales=products.filter(p=>!transactions.some(t=>t.product_id===p.id&&t.transaction_type==='sale'));
 if(noSales.length)result.push('销售记录提醒：以下产品没有已记录的销售，不代表一定滞销：'+noSales.map(p=>p.name).join('、'));
 const sales=transactions.filter(t=>t.transaction_type==='sale');
 if(!sales.length)result.push('目前没有销售记录，暂时无法分析销售表现。');
 else{
  const revenue=sales.reduce((s,t)=>s+Number(t.quantity)*Number(t.unit_price),0);
  result.push('累计销售收入：'+money(revenue));
 }
 aiResult.innerHTML=result.map(x=>'<p>• '+esc(x)+'</p>').join('');
}

function backupJSON(){
 const backup={
  version:'2.5',created_at:new Date().toISOString(),
  store,products,transactions,expenses
 };
 const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='store-backup-'+Date.now()+'.json';
 a.click();
 URL.revokeObjectURL(a.href);
}

async function start(){
 const {data}=await db.auth.getSession();
 if(data.session){
  user=data.session.user;
  await initStore();
 }
}
start();
</script>
</body>
</html>
